<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenhouse Sensor Logger</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="portal-header">
      <div class="header-content">
        <div class="brand">
          <span class="brand-icon">🍃</span>
          <h1>Greenhouse Sensor Logger <span class="brand-sub">smart monitoring</span></h1>
        </div>
        <div class="header-status">
          Active Log: <span id="queue-count" class="badge-count">0</span>
        </div>
      </div>
    </header>
<!-- Main Section-->
    <main class="portal-container">
        <!-- input form -->
         <aside class="panel form-panel">
            <h2 class="panel-title">Log Sensor Readings</h2>

            <!-- hidden error banner -->
             <div 
             id="form-error-banner" 
             class="alert alert-danger hidden"
             role="alert"
             aria-live="polite"
             ></div>

             <!--Sensor inputs-->
             <form action="#" id="metric-form" novalidate>
<!--bay id-->
                <div class="form-group">
                    <label for="bay-id" class="form-label">Greenhouse Bay ID<span class="required">*</span></label>
                    
                    <input 
                    type="text"
                    name="bay-id"
                    id="bay-id"
                    class="form-control"
                    placeholder="e.g. Bay-01"
                    required
                    />
                </div>
<!-- ph and ec-->
                <div class="form-row">
                    <div class="form-group">
                        <label for="ph" class="form-label">pH Level <span class="required">*</span></label>
                        
                        <input
                        type="number"
                        name="ph"
                        id="ph"
                        class="form-control"
                        min="0"
                        max="14"
                        step="0.1"
                        placeholder="6.0"
                        required
                        />
                    </div>

            <div class="form-group">
              <label for="ec" class="form-label">Electrical Conductivity (mS/cm)<span class="required">*</span></label>
              <input
                type="number"
                name="ec"
                id="ec"
                class="form-control"
                min="0"
                max="10"
                step="0.1"
                placeholder="3.0"
                required
              />
            </div>
          </div>
          <!-- air temp and relative humidity-->
           <div class="form-row">
            <div class="form-group">
                <label for="temperature" class="form-label">Air Temperature (F)<span class="required">*</span></label>

                <input 
                type="number"
                name="temperature"
                id="temperature"
                class="form-control"
                min="-10"
                max="200"
                step="0.1"
                placeholder="70"
                required
                />
            </div>
            <div class="form-group">
                <label for="humidity" class="form-label">Relative Humidity (%)<span class="required">*</span></label>
                
                <input 
                type="number"
                name="humidity"
                id="humidity"
                class="form-control"
                min="0"
                max="100"
                step="0.1"
                placeholder="40"
                required
                />
            </div>
           </div>

           <!-- submit sensor button-->
            <button type="submit" id="btn-submit" class="btn btn-primary btn-block">
                Record Reading
            </button>

             </form>
         </aside>
         <!-- Log queue output-->
          <section class="panel records-panel">
            <div class="records-header">
                <h2 class="panel-title">Log Queue</h2>
                <button id="btn-clear-all" class="btn btn-outline-danger btn-sm">
                Clear Queue
                </button>
             </div>
<!-- Log cards-->
             <div id="empty-state" class="empty-state"> 
                <span class="empty-icon">📋</span>
                <p>No sensor metrics logged</p>
             </div>
             <ul id="records-list" class="records-grid" aria-live="polite"></ul>
          </section>
    </main>
<!-- Footer section-->
    <footer class="portal-footer">
        <p>&copy; 2026 Greenhouse Sensor Logger </p>
    </footer>
    <!-- link javascript-->
     <script src="app.js"></script>
    
</body>
</html>
